semantic_models:
  - name: interview
    description:
    model: ref('fct_interview')
    defaults:
      agg_time_dimension: finished_at
    entities:
      - name: interview
        type: primary
        expr: ID
      - name: interviewer
        type: foreign
        expr: interviewer_offset
    dimensions:
      - name: finished_at
        type: time
        expr: cast(finished_datetime as DATETIME)
        type_params:
          time_granularity: day
      - name: finished_month
        type: time
        expr: cast(finished_datetime as DATETIME)
        type_params:
          time_granularity: month 
      - name: is_cancelled
        type: categorical
        expr: case when status = 'CANCELLED' then True else False end
      - name: is_completed
        type: categorical
        expr: case when status = 'COMPLETED' then True else False end
      - name: interviewer_filter
        type: categorical
        expr: interviewer_offset
    measures:
      - name: num_of_interviews
        description: "current number of all interviews"
        agg: count_distinct
        expr: ID
      - name: num_of_interviewers
        description: "current number of all involved interviewers"
        agg: count_distinct
        expr: interviewer_offset
      - name: feedback_delay_hours
        description: "feedback delay time"
        agg: average
        expr: feedback_delay_hours



metrics:
  - name: total_number_of_interviews
    description: "total number of interviews"
    type: simple
    type_params:
      measure: num_of_interviews
    label: total_number_of_interviews

  - name: total_number_of_interviewers
    description: "total number of interviewers/employees"
    type: simple
    type_params:
      measure: num_of_interviewers
    label: total_number_of_interviewers

  - name: feedback_hours
    description: "average hours for feedback completion"
    type: simple
    type_params:
      measure: feedback_delay_hours
    label: feedback_hours

  - name: ratio_of_cancelled_interviews
    description: "number of cancelled interviews compared to all interviews"
    type: ratio
    type_params:
      numerator: 
        name: total_number_of_interviews
        filter: "{{Dimension('interview__is_cancelled')}} = true"
      denominator:
        name: total_number_of_interviews
    label: ratio_of_cancelled_interviews
  
