saved_queries:
  - name: interviewer_performance
    description: "shows the number of completed interviews by interviewer, and feedback time"
    label: 
    config:
      cache:
        enabled: true
        tags: 'sm'
    query_params:
      metrics:
        - total_number_of_interviews
        - feedback_hours
      group_by:
        - Entity('interviewer')
        - TimeDimension('interview__finished_month', 'month')
      where:
        - "{{Dimension('interview__is_completed')}} = true"
        - "{{TimeDimension('interview__finished_month', 'month')}} = '2025-02-01'"
    exports:
      - name: monthly_interviewer_performance_export
        config:
          export_as: table 
          alias: interviewer_performance_export
          schema: mart